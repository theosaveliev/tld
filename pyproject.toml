[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Theo Saveliev", email = "89431871+theosaveliev@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "click>=8.5.1",
    "defusedxml>=0.7.1",
    "lxml>=6.1.3",
    "mwparserfromhell>=0.7.2",
    "pypandoc-binary>=1.17",
    "wikitextprocessor>=0.4.96",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[project.scripts]
run = "pipeline.main:cli"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "cambium>=1.0.0",
    "mdlint>=0.4.0",
    "mypy>=2.4.1",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-lxml>=2026.2.16",
    "wikiteam3>=4.4.10",
]

[tool.uv]
no-binary-package = ["mwparserfromhell"]
extra-build-variables = { mwparserfromhell = { WITH_EXTENSION = "0" } }


[tool.poe.executor]
type = "uv"

[tool.poe.env]
PYTHON_GIL = "0"

[tool.poe.tasks]
format = "ruff format"
lint = "ruff check --fix ."
mypy = "mypy ."
pyright = "basedpyright ."
test = "pytest"
dev = ["format", "lint", "mypy", "pyright"]
run = "run export-markdown tld/thelongdark.fandom.com-20261117-current.xml && cambium"
